id: MCP-003
name: MCP complete body and error output
workspace:
  seed_config: mcp
steps:
  - name: complete body overrides named values
    command: [mcp, fixture, echo, --text=ignored, --body, '{"text":"body","n":9007199254740993}']
    expect:
      exit_code: 0
      checks:
        - {path: data.result.structuredContent.arguments.text, equals: body}
  - name: missing required argument is local
    command: [mcp, fixture, echo]
    expect:
      exit_code: 1
      checks:
        - {path: error.code, equals: invalid_mcp_arguments}
  - name: tool error is not hidden by jq
    command: [mcp, fixture, fail, --text=x, --jq, empty]
    expect:
      exit_code: 2
      checks:
        - {path: error.code, equals: mcp_tool_error}
        - {path: data.result.isError, equals: true}
  - name: input required remains incomplete
    command: [mcp, fixture, input, --text=x]
    expect:
      exit_code: 2
      checks:
        - {path: error.code, equals: mcp_capability_unsupported}
        - {path: data.result.requestState, equals: pending}
  - name: preserve a known RPC error without exposing the session header
    command: [mcp, fixture, echo, --text, rpc-error]
    expect:
      exit_code: 2
      checks:
        - {path: error.code, equals: mcp_rpc_error}
        - {path: data.rpc_error.code, equals: -32602}
        - {path: data.rpc_error.message, equals: Unknown tool}
        - {path: headers.Mcp-Session-Id, equals: '***'}
  - name: retain the terminal SSE event at EOF
    command: [mcp, fixture, echo, --text, sse-eof]
    expect:
      exit_code: 0
      checks:
        - {path: data.result.structuredContent.arguments.text, equals: sse-eof}
        - {path: data.result.structuredContent.big, equals: 9007199254740993}
  - name: preserve RPC errors carried by HTTP 400
    command: [mcp, fixture, echo, --text, rpc-http-error]
    expect:
      exit_code: 2
      checks:
        - {path: error.code, equals: mcp_rpc_error}
        - {path: data.rpc_error.code, equals: -32602}
        - {path: data.rpc_error.message, equals: Unknown tool}
