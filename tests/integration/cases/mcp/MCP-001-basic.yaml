id: MCP-001
name: MCP connection discovery help and explicit call
workspace:
  seed_config: mcp
steps:
  - name: root help without credentials
    command: [mcp, --help]
    expect:
      exit_code: 0
  - name: server help without credentials
    command: [mcp, fixture, --help]
    expect:
      exit_code: 0
  - name: check connection and complete discovery
    env: {MCP_TEST_TOKEN: integration-mcp, MCP_TEST_SCENARIO: MCP-001}
    command: [mcp, fixture, --check]
    expect:
      exit_code: 0
      checks:
        - {path: data.checks.protocol, equals: passed}
        - {path: data.complete, equals: true}
        - {path: data.tool_count, equals: 4}
  - name: list tools
    env: {MCP_TEST_TOKEN: integration-mcp, MCP_TEST_SCENARIO: MCP-001}
    command: [mcp, fixture, --tools]
    expect:
      exit_code: 0
      checks:
        - {path: data.tools, kind: list, length_at_least: 4}
  - name: dynamic help
    env: {MCP_TEST_TOKEN: integration-mcp, MCP_TEST_SCENARIO: MCP-001}
    command: [mcp, fixture, echo, --help]
    expect:
      exit_code: 0
  - name: explicit tool call
    env: {MCP_TEST_TOKEN: integration-mcp, MCP_TEST_SCENARIO: MCP-001}
    command: [mcp, fixture, echo, --text, 中文]
    expect:
      exit_code: 0
      checks:
        - {path: data.result.structuredContent.arguments.text, equals: 中文}
