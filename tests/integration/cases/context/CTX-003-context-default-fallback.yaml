id: CTX-003
name: context falls back only to default when no active context exists
tags:
  - coverage-context
  - suite-integration
steps:
  - name: create a non-default context without activating it
    command:
      - context
      - create
      - alpha
      - --bk_api_url_tmpl
      - ${HTTPBIN_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: status fails instead of picking a non-default context
    command:
      - context
      - status
    expect:
      exit_code: nonzero
      checks:
        - path: ok
          equals: false
        - path: error.code
          equals: context_error
        - path: error.message
          contains: no active context and no "default" context
  - name: request commands fail the same way
    command:
      - --dry-run
      - api
      - demo
      - GET
      - /anything
    expect:
      exit_code: nonzero
      checks:
        - path: ok
          equals: false
        - path: error.code
          equals: config_error
        - path: error.message
          contains: bk-cli context use NAME
  - name: create the default context without activating it
    command:
      - context
      - create
      - default
      - --bk_api_url_tmpl
      - ${HTTPBIN_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: status falls back to default
    command:
      - context
      - status
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.context
          equals: default
