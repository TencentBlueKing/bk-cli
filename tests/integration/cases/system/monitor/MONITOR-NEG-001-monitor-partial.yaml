id: MONITOR-NEG-001
name: monitor partial
tags: [coverage-system_go, suite-integration, uses-mock]
steps:
  - name: init mock context
    command: ["context", "init", "--bk_api_url_tmpl", "${MOCK_API_BASE_URL}/{gateway_name}"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command: ["auth", "login", "--access_token", "integration-token"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: partial
    command: ["monitor", "logs", "--header", "X-Mock-Scenario:MONITOR-NEG-001", "--config", "${FIXTURES_DIR}/monitor.json"]
    expect:
      exit_code: 2
      checks:
        - path: ok
          equals: true
        - path: data.is_partial
          equals: true
        - path: data.status.code
          equals: "timeout"
