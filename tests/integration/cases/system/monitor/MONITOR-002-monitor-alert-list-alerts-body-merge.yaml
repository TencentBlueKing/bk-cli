id: MONITOR-002
name: monitor alert list_alerts merges body and flags
tags:
  - coverage-system_go
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: list alerts
    command:
      - monitor
      - alert
      - list_alerts
      - --body
      - '{"bk_biz_id":"1","page_size":"50"}'
      - --bk_biz_id
      - "100100"
      - --status
      - ABNORMAL
      - --since
      - 1h
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.tool_args.bk_biz_id
          equals: "100100"
        - path: data.tool_args.bk_biz_ids.0
          equals: "100100"
        - path: data.tool_args.page_size
          equals: "50"
        - path: data.tool_args.status.0
          equals: ABNORMAL
