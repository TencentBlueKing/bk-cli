id: MONITOR-001
name: monitor logs
tags: [coverage-system_go, suite-integration, uses-mock]
steps:
  - name: init mock context
    command: ["context", "init", "--bk_api_url_tmpl", "${MOCK_API_BASE_URL}/{gateway_name}"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command: ["auth", "login", "--access_token", "integration-token"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: logs
    command: ["monitor", "logs", "--log-source", "stdout", "--query", "ERROR", "--config", "${FIXTURES_DIR}/monitor.json"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.echo.space_uid
          equals: "log-space"
        - path: data.echo.body.query_list.0.table_id
          equals: "logs"
        - path: data.echo.body.query_list.0.query_string
          equals: "ERROR"
        - path: data.list.0.id
          kind: number
        - path: data.list.0.nested
          length_at_least: 2
