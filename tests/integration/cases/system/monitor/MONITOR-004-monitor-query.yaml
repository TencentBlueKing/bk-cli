id: MONITOR-004
name: monitor query
tags: [coverage-system_go, suite-integration, uses-mock]
steps:
  - name: init mock context
    command: ["context", "init", "--bk_api_url_tmpl", "${MOCK_API_BASE_URL}/{gateway_name}"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command: ["auth", "login", "--access_token", "integration-token"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: query
    command: ["monitor", "query", "--promql", "sum(up{namespace={{namespace}}})", "--config", "${FIXTURES_DIR}/monitor.json"]
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.echo.body.promql
          equals: "sum(up{namespace=\"dev-ns\"})"
