id: MONITOR-012
name: monitor profile preflight checks the tool-specific table and propagates request options
steps:
  - name: init mock context
    command: [context, init, --bk_api_url_tmpl, "${MOCK_API_BASE_URL}/{gateway_name}"]
    expect: {exit_code: 0}
  - name: login
    command: [auth, login, --access_token, integration-token]
    expect: {exit_code: 0}
  - name: reject the missing overridden time-series table
    command: [monitor, profile, check, --profile, sample, --profile_file, /workspace/tests/integration/fixtures/monitor-review-profile.yaml, --stage, testing, --header, 'X-Example:preflight', --header, 'X-Mock-Scenario:MONITOR-012']
    expect:
      exit_code: 1
      checks:
        - {path: ok, equals: false}
        - {path: data.bindings.0.failure.decision, equals: resource_not_found}
  - name: keep a BkBase-only SQL table permission_only without time-series lookup or SQL
    command: [monitor, profile, check, --profile, bkbase, --profile_file, /workspace/tests/integration/fixtures/monitor-review-profile.yaml, --stage, testing, --header, 'X-Example:preflight', --header, 'X-Mock-Scenario:MONITOR-012']
    expect:
      exit_code: 0
      checks:
        - {path: ok, equals: true}
        - {path: data.bindings.0.tool, equals: execute_sql_query}
        - {path: data.bindings.0.result.validation, equals: permission_only}
