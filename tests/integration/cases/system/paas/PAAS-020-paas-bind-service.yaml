id: PAAS-020
name: paas bind_service happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: bind service
    command:
      - paas
      - bind_service
      - --body
      - '{"code":"bk-demo","service_id":"svc-uuid","module_name":"default"}'
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: POST
        - path: data.path
          contains: /bkpaas3/prod/services/service-attachments/
        - path: data.body.code
          equals: bk-demo
        - path: data.body.service_id
          equals: svc-uuid
        - path: data.body.module_name
          equals: default
