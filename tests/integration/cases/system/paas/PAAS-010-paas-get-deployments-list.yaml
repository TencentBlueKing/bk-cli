id: PAAS-010
name: paas get_deployments_list happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: get deployments list
    command:
      - paas
      - get_deployments_list
      - --app_code
      - bk-demo
      - --environment
      - prod
      - --limit
      - "12"
      - --offset
      - "0"
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: GET
        - path: data.path
          contains: /bkpaas3/prod/bkapps/applications/bk-demo/modules/default/deployments/lists/
        - path: data.query.environment
          equals: prod
        - path: data.query.limit
          equals: "12"
        - path: data.query.offset
          equals: "0"
