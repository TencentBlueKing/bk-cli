id: PAAS-011
name: paas streams_history_events happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: get deployment stream events
    command:
      - paas
      - streams_history_events
      - --channel_id
      - 22d0e9c8-9cfc-45a5-b5a8-718137c515db
      - --last_event_id
      - "10"
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: GET
        - path: data.path
          contains: /bkpaas3/prod/streams/22d0e9c8-9cfc-45a5-b5a8-718137c515db/history_events
        - path: data.query.last_event_id
          equals: "10"
