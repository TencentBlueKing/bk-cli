id: PAAS-008
name: paas list_app_modules happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: list app modules
    command:
      - paas
      - list_app_modules
      - --app_code
      - bk-demo
      - --source_origin
      - "1"
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: GET
        - path: data.path
          contains: /bkpaas3/prod/bkapps/applications/bk-demo/modules/
        - path: data.query.source_origin
          equals: "1"
