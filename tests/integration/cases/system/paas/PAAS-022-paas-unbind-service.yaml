id: PAAS-022
name: paas unbind_service happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: unbind service
    command:
      - paas
      - unbind_service
      - --app_code
      - bk-demo
      - --service_id
      - svc-uuid
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: DELETE
        - path: data.path
          contains: /bkpaas3/prod/bkapps/applications/bk-demo/modules/default/services/svc-uuid/
