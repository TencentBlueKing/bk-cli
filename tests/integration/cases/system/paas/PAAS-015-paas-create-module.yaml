id: PAAS-015
name: paas create_module happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: create module
    command:
      - paas
      - create_module
      - --app_code
      - bk-demo
      - --body
      - '{"name":"api","source_config":{"source_init_template":"dj2_with_auth","source_origin":2},"bkapp_spec":{"build_config":{"build_method":"buildpack"}}}'
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: POST
        - path: data.path
          contains: /bkpaas3/prod/bkapps/applications/bk-demo/modules/
        - path: data.body.name
          equals: api
        - path: data.body.source_config.source_init_template
          equals: dj2_with_auth
        - path: data.body.bkapp_spec.build_config.build_method
          equals: buildpack
