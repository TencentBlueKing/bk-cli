id: PAAS-006
name: paas get_minimal_app_list happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: get minimal app list
    command:
      - paas
      - get_minimal_app_list
      - --app_status
      - normal
      - --source_origin
      - "1"
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: GET
        - path: data.path
          contains: /bkpaas3/prod/bkapps/applications/lists/minimal
        - path: data.query.app_status
          equals: normal
        - path: data.query.source_origin
          equals: "1"
