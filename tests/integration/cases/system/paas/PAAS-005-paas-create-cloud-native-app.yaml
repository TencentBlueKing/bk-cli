id: PAAS-005
name: paas create_cloud_native_app happy path
tags:
  - coverage-system_yaml
  - suite-integration
steps:
  - name: init mock-backed context
    command:
      - context
      - init
      - --bk_api_url_tmpl
      - ${MOCK_API_BASE_URL}/{gateway_name}
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: login
    command:
      - auth
      - login
      - --access_token
      - integration-token
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
  - name: create cloud native app
    command:
      - paas
      - create_cloud_native_app
      - --body
      - '{"code":"bk-demo","name":"bk-demo","source_config":{"source_origin":1,"source_repo_url":"https://github.com/octocat/helloWorld.git","source_repo_auth_info":{},"source_dir":"","source_init_template":"docker"},"bkapp_spec":{"build_config":{"build_method":"dockerfile","dockerfile_path":"Dockerfile"}}}'
    expect:
      exit_code: 0
      checks:
        - path: ok
          equals: true
        - path: data.method
          equals: POST
        - path: data.path
          contains: /bkpaas3/prod/bkapps/cloud-native/
        - path: data.body.code
          equals: bk-demo
        - path: data.body.source_config.source_origin
          equals: 1
        - path: data.body.bkapp_spec.build_config.build_method
          equals: dockerfile
        - path: data.body.bkapp_spec.build_config.dockerfile_path
          equals: Dockerfile
