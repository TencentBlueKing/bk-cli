id: AIDEV-036
name: aidev trigger_knowledge_update happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: trigger knowledge update
  command:
  - aidev
  - trigger_knowledge_update
  - --body
  - '{"space_id":"demo-space"}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledges/trigger/
    - path: data.body.space_id
      equals: demo-space
