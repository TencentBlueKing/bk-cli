id: AIDEV-026
name: aidev delete_knowledgebase happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: reject missing DELETE body before login
  command:
  - aidev
  - delete_knowledgebase
  - --id
  - '1'
  expect:
    exit_code: 1
    checks:
    - path: error.code
      equals: missing_param
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: delete knowledgebase
  command:
  - aidev
  - delete_knowledgebase
  - --id
  - '1'
  - --body
  - '{"space_id":"demo-space"}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: DELETE
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledgebase/1/
    - path: data.body.space_id
      equals: "demo-space"
