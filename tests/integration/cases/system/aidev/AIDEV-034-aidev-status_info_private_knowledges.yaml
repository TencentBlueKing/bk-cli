id: AIDEV-034
name: aidev status_info_private_knowledges happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: status info private knowledges
  command:
  - aidev
  - status_info_private_knowledges
  - --space_id
  - demo-space
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: GET
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledges/status_info/
