id: AIDEV-028
name: aidev create_private_knowledges happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: create private knowledges
  command:
  - aidev
  - create_private_knowledges
  - --body
  - '{"space_id":"demo-space","knowledge_base_id":1,"knowledge_name":"Demo Knowledge","file_name":"demo.md","file_path":"bkrepo://demo.md"}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledges/
    - path: data.body.space_id
      equals: demo-space
