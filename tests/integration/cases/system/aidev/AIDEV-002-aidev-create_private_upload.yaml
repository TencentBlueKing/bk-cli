id: AIDEV-002
name: aidev create_private_upload happy path
tags:
- coverage-system_go
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: create private upload
  command:
  - aidev
  - create_private_upload
  - --file
  - tests/integration/fixtures/files/aidev-upload.txt
  - --space_id
  - demo-space
  - --module
  - knowledge
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/upload/
