id: AIDEV-064
name: aidev legacy gateway template dry run
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init legacy context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - https://{gateway_name}.apigw.te.example
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: preview aidev spaces
  command:
  - aidev
  - list_spaces
  - --keyword
  - demo
  - --dry-run
  expect:
    exit_code: 0
    checks:
    - path: dry_run
      equals: true
    - path: request.url
      contains: https://bkaidev.apigw.te.example/prod/openapi/aidev/private/v1/spaces/
