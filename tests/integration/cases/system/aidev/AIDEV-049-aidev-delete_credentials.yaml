id: AIDEV-049
name: aidev delete_credentials happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: delete credentials
  command:
  - aidev
  - delete_credentials
  - --credential_id
  - '1'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: DELETE
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/credentials/1/
