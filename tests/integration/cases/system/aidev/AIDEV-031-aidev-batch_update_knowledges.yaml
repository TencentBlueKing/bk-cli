id: AIDEV-031
name: aidev batch_update_knowledges happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: batch update knowledges
  command:
  - aidev
  - batch_update_knowledges
  - --body
  - '{"space_id":"demo-space","items":[{"id":1,"knowledge_name":"Updated Knowledge"}]}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledges/batch/update/
    - path: data.body.space_id
      equals: demo-space
    - path: data.body.items.0.id
      equals: 1
