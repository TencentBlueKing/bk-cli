id: AIDEV-024
name: aidev info_private_knowledgebase happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: info private knowledgebase
  command:
  - aidev
  - info_private_knowledgebase
  - --space_id
  - demo-space
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: GET
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledgebase/info/
