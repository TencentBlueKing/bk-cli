id: AIDEV-010
name: aidev create_private_mcps happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: create private mcps
  command:
  - aidev
  - create_private_mcps
  - --body
  - '{"space_id":"demo-space","mcp_name":"demo-mcp_name","mcp_code":"demo-mcp","url":"bkrepo://demo.zip","protocol":"stdio","credential_type":"api_key","description":"demo
    description"}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/mcps/
    - path: data.body.space_id
      equals: demo-space
