id: AIDEV-029
name: aidev batch_create_knowledges happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: batch create knowledges
  command:
  - aidev
  - batch_create_knowledges
  - --body
  - '{"space_id":"demo-space","items":[{"knowledge_base_id":1,"knowledge_name":"Demo Knowledge","file_name":"demo.md","file_path":"demo.md","url":"bkrepo://demo.md"}]}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledges/batch/create/
    - path: data.body.space_id
      equals: demo-space
    - path: data.body.items.0.file_path
      equals: "demo.md"
    - path: data.body.items.0.url
      equals: "bkrepo://demo.md"
