id: AIDEV-027
name: aidev update_private_knowledgebase happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: update private knowledgebase
  command:
  - aidev
  - update_private_knowledgebase
  - --id
  - '1'
  - --body
  - '{"space_id":"demo-space","id":1}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: PATCH
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/knowledgebase/1/update/
    - path: data.body.space_id
      equals: demo-space
