id: AIDEV-055
name: aidev upsert_private_collections happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: upsert private collections
  command:
  - aidev
  - upsert_private_collections
  - --body
  - '{"space_id":"demo-space","collection_code":"demo-collection","collection_name":"demo
    collection","content":[]}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: POST
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/collections/upsert/
    - path: data.body.space_id
      equals: demo-space
