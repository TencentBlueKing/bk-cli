id: AIDEV-051
name: aidev update_credentials happy path
tags:
- coverage-system_yaml
- suite-integration
steps:
- name: init mock-backed context
  command:
  - context
  - init
  - --bk_api_url_tmpl
  - ${MOCK_API_BASE_URL}/{gateway_name}
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: login
  command:
  - auth
  - login
  - --access_token
  - integration-token
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
- name: update credentials
  command:
  - aidev
  - update_credentials
  - --credential_id
  - '1'
  - --body
  - '{"credential_name":"demo-credential","credential_type":"api_key","credential_detail":"demo-credential-detail","space_id":"demo-space","credential_id":1}'
  expect:
    exit_code: 0
    checks:
    - path: ok
      equals: true
    - path: data.method
      equals: PATCH
    - path: data.path
      contains: /bk-aidev/prod/openapi/aidev/private/v1/credentials/1/update/
    - path: data.body.credential_name
      equals: demo-credential
