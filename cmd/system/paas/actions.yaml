name: paas
gateway_name: bkpaas3
description: "BlueKing PaaS application deployment commands"
actions:
  - name: get_minimal_app_list
    description: "获取 App 简明信息列表"
    method: GET
    path: "/bkapps/applications/lists/minimal"
    timeout: 30s
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_status
        in: query
        type: string
        description: "应用状态过滤，常见值为 not_deployed、normal 或 offline"
      - name: source_origin
        in: query
        type: int
        description: "源码来源过滤，常见值 1 表示代码仓库"
    examples:
      - "bk-cli paas get_minimal_app_list"
      - "bk-cli paas get_minimal_app_list --app_status normal --source_origin 1"

  - name: get_app_info
    description: "查看应用信息"
    method: GET
    path: "/bkapps/applications/{app_code}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
    examples:
      - "bk-cli paas get_app_info --app_code bk-demo"

  - name: list_app_modules
    description: "查看应用下所有的模块"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: source_origin
        in: query
        type: int
        description: "源码来源过滤，常见值 1 表示代码仓库"
    examples:
      - "bk-cli paas list_app_modules --app_code bk-demo"
      - "bk-cli paas list_app_modules --app_code bk-demo --source_origin 1"

  - name: get_repo_branches
    description: "获取应用的代码仓库分支信息"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/repo/branches/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
    examples:
      - "bk-cli paas get_repo_branches --app_code bk-demo"
      - "bk-cli paas get_repo_branches --app_code bk-demo --module default"

  - name: get_deployments_list
    description: "获取 App 部署历史"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/deployments/lists/"
    timeout: 30s
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: environment
        in: query
        type: string
        description: "部署环境，常见值为 stag 或 prod；不传返回全部环境"
      - name: operator
        in: query
        type: string
        description: "操作者用户名"
      - name: limit
        in: query
        type: int
        description: "每页条数，默认由服务端决定，常见默认值为 12"
      - name: offset
        in: query
        type: int
        description: "分页偏移量，默认由服务端决定，常见默认值为 0"
    examples:
      - "bk-cli paas get_deployments_list --app_code bk-demo"
      - "bk-cli paas get_deployments_list --app_code bk-demo --module default --environment prod --limit 12 --offset 0"

  - name: streams_history_events
    description: "获取部署日志流"
    method: GET
    path: "/streams/{channel_id}/history_events"
    timeout: 30s
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: channel_id
        in: path
        type: string
        description: "部署任务 ID，通常为 deployment_id"
        required: true
      - name: last_event_id
        in: query
        type: int
        description: "从该事件 ID 之后继续拉取；首次查询可不传"
    examples:
      - "bk-cli paas streams_history_events --channel_id 22d0e9c8-9cfc-45a5-b5a8-718137c515db"
      - "bk-cli paas streams_history_events --channel_id 22d0e9c8-9cfc-45a5-b5a8-718137c515db --last_event_id 10"

  - name: list_processes
    description: "获取应用环境所有进程与实例信息"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/envs/{env}/processes/list/"
    timeout: 30s
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: env
        in: path
        type: string
        description: "环境，常见值为 stag 或 prod"
        required: true
      - name: release_id
        in: query
        type: string
        description: "发布版本 ID；常用不传"
    examples:
      - "bk-cli paas list_processes --app_code bk-demo --env stag"
      - "bk-cli paas list_processes --app_code bk-demo --module default --env prod --release_id 123"

  - name: module_env_released_info
    description: "查询应用模块环境部署信息"
    method: GET
    path: "/bkapps/applications/{code}/modules/{module_name}/envs/{environment}/released_info/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module_name
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: environment
        in: path
        type: string
        description: "环境，常见值为 stag 或 prod"
        required: true
    examples:
      - "bk-cli paas module_env_released_info --code bk-demo --environment prod"
      - "bk-cli paas module_env_released_info --code bk-demo --module_name default --environment prod"

  - name: module_env_released_state
    description: "查询应用模块环境部署状态"
    method: GET
    path: "/bkapps/applications/{code}/modules/{module_name}/envs/{environment}/released_state/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module_name
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: environment
        in: path
        type: string
        description: "环境，常见值为 stag 或 prod"
        required: true
    examples:
      - "bk-cli paas module_env_released_state --code bk-demo --environment prod"
      - "bk-cli paas module_env_released_state --code bk-demo --module_name default --environment stag"

  - name: search_standard_log_with_post
    description: "查询应用标准输出日志"
    method: POST
    path: "/bkapps/applications/{app_code}/modules/{module}/log/standard_output/list/"
    timeout: 30s
    body_schema: |-
      {
        "type": "object",
        "properties": {
          "query": {
            "type": "object",
            "properties": {
              "query_string": {
                "type": "string",
                "description": "ES query_string 关键字；无关键字时传空字符串"
              },
              "terms": {
                "type": "object",
                "description": "多值精准匹配条件，例如 environment 或 process_id",
                "additionalProperties": {
                  "type": "array",
                  "items": {"type": "string"}
                }
              },
              "exclude": {
                "type": "object",
                "description": "terms 取反条件"
              }
            }
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: time_range
        in: query
        type: string
        description: "时间范围，常见值为 5m、1h、3h、6h、12h、1d、3d、7d、customized"
        default: 1h
      - name: start_time
        in: query
        type: string
        description: "开始时间；time_range=customized 时填写，格式 2006-01-02 15:04:05"
      - name: end_time
        in: query
        type: string
        description: "结束时间；time_range=customized 时填写，格式 2006-01-02 15:04:05"
      - name: limit
        in: query
        type: int
        description: "每页条数，默认由服务端决定，常见默认值为 100"
      - name: scroll_id
        in: query
        type: string
        description: "滚动 ID；首次查询可不传"
    examples:
      - "bk-cli paas search_standard_log_with_post --app_code bk-demo --body '{\"query\":{\"query_string\":\"\",\"terms\":{\"environment\":[\"stag\"]}}}'"
      - "bk-cli paas search_standard_log_with_post --app_code bk-demo --module default --time_range customized --start_time '2026-08-24 10:00:00' --end_time '2026-08-24 11:00:00' --body '{\"query\":{\"query_string\":\"error\",\"terms\":{\"environment\":[\"prod\"],\"process_id\":[\"web\"]}}}'"

  - name: create_module
    description: "创建模块"
    method: POST
    path: "/bkapps/applications/{app_code}/modules/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "required": ["name", "source_config", "bkapp_spec"],
        "properties": {
          "name": {
            "type": "string",
            "description": "模块名称，只能包含小写字母、数字和连字符，长度不超过 16 位"
          },
          "source_config": {
            "type": "object",
            "properties": {
              "source_init_template": {
                "type": "string",
                "description": "源初始化模板"
              },
              "source_origin": {
                "type": "integer",
                "description": "源码来源"
              },
              "source_control_type": {
                "type": "string",
                "description": "源码控制类型"
              },
              "source_repo_url": {
                "type": "string",
                "description": "源码仓库或镜像仓库地址"
              },
              "source_repo_auth_info": {
                "type": "object",
                "description": "源码仓库认证信息"
              },
              "source_dir": {
                "type": "string",
                "description": "构建目录"
              }
            }
          },
          "bkapp_spec": {
            "type": "object",
            "required": ["build_config"],
            "properties": {
              "build_config": {
                "type": "object",
                "required": ["build_method"],
                "properties": {
                  "build_method": {
                    "type": "string",
                    "description": "构建方法，例如 buildpack、dockerfile 或 custom_image"
                  },
                  "tag_options": {
                    "type": "object",
                    "description": "镜像 Tag 规则"
                  },
                  "buildpacks": {
                    "type": "array",
                    "description": "Buildpack 列表"
                  },
                  "bp_stack_name": {
                    "type": "string",
                    "description": "Buildpack 基础镜像名"
                  },
                  "dockerfile_path": {
                    "type": "string",
                    "description": "Dockerfile 路径"
                  },
                  "docker_build_args": {
                    "type": "object",
                    "description": "Docker 构建参数"
                  },
                  "image_repository": {
                    "type": "string",
                    "description": "自定义镜像仓库"
                  },
                  "image_credential": {
                    "type": "object",
                    "description": "镜像凭证信息"
                  }
                }
              },
              "processes": {
                "type": "array",
                "description": "进程规格；纯镜像模块必填"
              },
              "hook": {
                "type": "object",
                "description": "部署 hook 配置"
              }
            }
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
    examples:
      - "bk-cli paas create_module --app_code bk-demo --body '{\"name\":\"api\",\"source_config\":{\"source_init_template\":\"dj2_with_auth\",\"source_origin\":2},\"bkapp_spec\":{\"build_config\":{\"build_method\":\"buildpack\"}}}'"

  - name: get_deployment_result
    description: "查询部署任务结果"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/deployments/{deployment_id}/result/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: deployment_id
        in: path
        type: string
        description: "部署任务 ID"
        required: true
    examples:
      - "bk-cli paas get_deployment_result --app_code bk-demo --deployment_id 12345"
      - "bk-cli paas get_deployment_result --app_code bk-demo --module default --deployment_id 12345"

  - name: deploy_with_module
    description: "App 部署（支持多模块）"
    method: POST
    path: "/bkapps/applications/{app_code}/modules/{module}/envs/{env}/deployments/"
    timeout: 30s
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "required": ["version_name", "version_type"],
        "properties": {
          "revision": {
            "type": "string",
            "description": "源码仓库版本号"
          },
          "version_name": {
            "type": "string",
            "description": "branch 或 tag 的名称"
          },
          "version_type": {
            "type": "string",
            "description": "对于 svn，支持 trunk/tag；对于 git，支持 branch"
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: env
        in: path
        type: string
        description: "环境，常见值为 stag 或 prod"
        required: true
    examples:
      - "bk-cli paas deploy_with_module --app_code bk-demo --env prod --body '{\"revision\":\"{commit_id}\",\"version_type\":\"branch\",\"version_name\":\"master\"}'"
      - "bk-cli paas deploy_with_module --app_code bk-demo --module default --env prod --body '{\"revision\":\"{commit_id}\",\"version_type\":\"branch\",\"version_name\":\"master\"}'"

  - name: create_cloud_native_app
    description: "创建云原生应用"
    method: POST
    path: "/bkapps/cloud-native/"
    timeout: 30s
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "required": ["code", "name", "source_config", "bkapp_spec"],
        "properties": {
          "code": {
            "type": "string",
            "description": "应用 ID"
          },
          "name": {
            "type": "string",
            "description": "应用名称"
          },
          "app_tenant_mode": {
            "type": "string",
            "description": "应用租户模式，常见值为 single 或 global"
          },
          "auth_code": {
            "type": "string",
            "description": "使用保留应用 ID 前缀时需要提供的 8 位授权码"
          },
          "is_plugin_app": {
            "type": "boolean",
            "description": "是否创建为插件应用"
          },
          "source_config": {
            "type": "object",
            "required": ["source_origin"],
            "properties": {
              "source_origin": {
                "type": "integer",
                "description": "源码来源，1 表示已授权代码仓库；6 表示上游 SourceOrigin.CNATIVE_IMAGE，仅托管镜像的云原生应用"
              },
              "source_control_type": {
                "type": "string",
                "description": "代码仓库类型"
              },
              "source_repo_url": {
                "type": "string",
                "description": "代码仓库或镜像仓库地址"
              },
              "source_repo_auth_info": {
                "type": "object",
                "description": "代码仓库认证信息"
              },
              "source_dir": {
                "type": "string",
                "description": "源码构建目录"
              },
              "source_init_template": {
                "type": "string",
                "description": "初始化模板名称"
              },
              "auto_create_repo": {
                "type": "boolean",
                "description": "是否由平台新建代码仓库"
              },
              "repo_group": {
                "type": "string",
                "description": "新建代码仓库的项目组"
              },
              "repo_name": {
                "type": "string",
                "description": "新建代码仓库的名称"
              },
              "write_template_to_repo": {
                "type": "boolean",
                "description": "是否将模板代码初始化到代码仓库中"
              }
            }
          },
          "bkapp_spec": {
            "type": "object",
            "required": ["build_config"],
            "properties": {
              "build_config": {
                "type": "object",
                "required": ["build_method"],
                "properties": {
                  "build_method": {
                    "type": "string",
                    "description": "构建方式，支持 buildpack、dockerfile、custom_image"
                  },
                  "dockerfile_path": {
                    "type": "string",
                    "description": "Dockerfile 路径，build_method 为 dockerfile 时使用"
                  },
                  "docker_build_args": {
                    "type": "object",
                    "description": "Docker 构建参数"
                  },
                  "image_repository": {
                    "type": "string",
                    "description": "镜像仓库，build_method 为 custom_image 时必填且需和 source_config.source_repo_url 一致"
                  },
                  "image_credential": {
                    "type": "object",
                    "description": "镜像凭证，包含 name、username、password"
                  },
                  "tag_options": {
                    "type": "object",
                    "description": "镜像 Tag 规则"
                  }
                }
              },
              "processes": {
                "type": "array",
                "description": "进程配置；custom_image 场景必填"
              },
              "hook": {
                "type": "object",
                "description": "部署前置钩子配置"
              }
            }
          },
          "advanced_options": {
            "type": "object",
            "description": "高级创建选项，例如 env_cluster_names"
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli paas create_cloud_native_app --body '{\"code\":\"bk-demo\",\"name\":\"bk-demo\",\"source_config\":{\"source_origin\":1,\"source_repo_url\":\"https://github.com/octocat/helloWorld.git\",\"source_repo_auth_info\":{},\"source_dir\":\"\",\"source_init_template\":\"docker\"},\"bkapp_spec\":{\"build_config\":{\"build_method\":\"dockerfile\",\"dockerfile_path\":\"Dockerfile\"}}}'"

  - name: list_config_vars
    description: "查看应用模块的环境变量列表"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/config_vars/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
    examples:
      - "bk-cli paas list_config_vars --app_code bk-demo"
      - "bk-cli paas list_config_vars --app_code bk-demo --module default"

  - name: get_config_var
    description: "通过 key 查询环境变量"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/config_vars/{config_var_key}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: config_var_key
        in: path
        type: string
        description: "环境变量 key"
        required: true
    examples:
      - "bk-cli paas get_config_var --app_code bk-demo --config_var_key FOO"
      - "bk-cli paas get_config_var --app_code bk-demo --module default --config_var_key FOO"

  - name: set_config_var_value
    description: "通过 key 创建或更新环境变量"
    method: POST
    path: "/bkapps/applications/{app_code}/modules/{module}/config_vars/{config_var_key}/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "required": ["environment_name"],
        "properties": {
          "environment_name": {
            "type": "string",
            "description": "生效环境。stag=预发布，prod=生产，_global_=所有环境"
          },
          "value": {
            "type": "string",
            "description": "环境变量值。新建时必填，更新时为空则不改 value"
          },
          "description": {
            "type": "string",
            "description": "变量描述，不超过 200 个字符"
          },
          "is_sensitive": {
            "type": "boolean",
            "description": "是否敏感。敏感值在查询时会被掩码"
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: config_var_key
        in: path
        type: string
        description: "环境变量 key"
        required: true
    examples:
      - "bk-cli paas set_config_var_value --app_code bk-demo --config_var_key FOO --body '{\"environment_name\":\"stag\",\"value\":\"bar\",\"description\":\"demo config\",\"is_sensitive\":false}'"
      - "bk-cli paas set_config_var_value --app_code bk-demo --module default --config_var_key SECRET --body '{\"environment_name\":\"prod\",\"value\":\"secret\",\"is_sensitive\":true}'"

  - name: list_module_services
    description: "查看应用模块的增强服务"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/services/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
    examples:
      - "bk-cli paas list_module_services --app_code bk-demo"
      - "bk-cli paas list_module_services --app_code bk-demo --module default"

  - name: bind_service
    description: "绑定应用模块与增强服务"
    method: POST
    path: "/services/service-attachments/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "required": ["code", "service_id"],
        "properties": {
          "code": {
            "type": "string",
            "description": "应用 ID"
          },
          "service_id": {
            "type": "string",
            "description": "增强服务 UUID，可通过 list_module_services 的 unbound[].uuid 获取"
          },
          "module_name": {
            "type": "string",
            "description": "模块名，默认 default"
          },
          "plan_id": {
            "type": "string",
            "description": "手动指定方案 ID。不传则使用平台默认方案"
          },
          "env_plan_id_map": {
            "type": "object",
            "description": "分环境方案 ID，例如 {\"stag\": \"<plan_id>\", \"prod\": \"<plan_id>\"}"
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli paas bind_service --body '{\"code\":\"bk-demo\",\"service_id\":\"svc-uuid\",\"module_name\":\"default\"}'"
      - "bk-cli paas bind_service --body '{\"code\":\"bk-demo\",\"service_id\":\"svc-uuid\",\"module_name\":\"default\",\"env_plan_id_map\":{\"stag\":\"plan-stag\",\"prod\":\"plan-prod\"}}'"

  - name: get_service_instance_by_module
    description: "查看应用模块与增强服务的绑定关系详情"
    method: GET
    path: "/bkapps/applications/{app_code}/modules/{module}/services/{service_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: service_id
        in: path
        type: string
        description: "增强服务 UUID"
        required: true
    examples:
      - "bk-cli paas get_service_instance_by_module --app_code bk-demo --service_id svc-uuid"
      - "bk-cli paas get_service_instance_by_module --app_code bk-demo --module default --service_id svc-uuid"

  - name: unbind_service
    description: "解绑应用模块与增强服务"
    method: DELETE
    path: "/bkapps/applications/{app_code}/modules/{module}/services/{service_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: app_code
        in: path
        type: string
        description: "应用 ID"
        required: true
      - name: module
        in: path
        type: string
        description: "模块名，默认模块通常为 default"
        default: default
      - name: service_id
        in: path
        type: string
        description: "增强服务 UUID"
        required: true
    examples:
      - "bk-cli paas unbind_service --app_code bk-demo --service_id svc-uuid"
      - "bk-cli paas unbind_service --app_code bk-demo --module default --service_id svc-uuid"
