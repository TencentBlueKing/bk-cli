          },
          "prompt_name": {
            "type": "string",
            "title": "Prompt Name",
            "description": "Prompt 名称"
          },
          "generate_type": {
            "type": "string",
            "title": "Generate Type",
            "default": "user",
            "description": "公开类型"
          }
        },
        "description": "Prompt 创建/更新请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev upsert_prompt --body '{\"space_id\":\"demo-space\",\"prompt_code\":\"demo-prompt\",\"prompt_name\":\"Demo Prompt\",\"content\":\"demo content\"}'"

  - name: get_prompt
