            "maxLength": 1024,
            "description": "凭证描述"
          },
          "credential_id": {
            "type": "integer",
            "title": "Credential Id",
            "description": "凭证 ID"
          },
          "credential_code": {
            "type": "string",
            "title": "Credential Code",
            "default": "",
            "maxLength": 64,
            "description": "凭证英文标识"
          },
          "credential_name": {
            "type": "string",
            "title": "Credential Name",
            "description": "凭证名称"
          },
          "credential_type": {
            "enum": [
              "apigw",
              "apigw_access_token",
              "basic_auth",
              "github_token",
