                "title": "KnowledgeResourceFineGrainedScoreType",
                "description": "相关性判断模型"
              }
            ],
            "default": "LLM"
          }
        },
        "description": "App/private 使用显式空间参数；Agent 上下文接口沿用原协议。"
      }
