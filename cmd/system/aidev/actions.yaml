        description: "凭证 ID"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev list_credential_references --credential_id 1 --space_id demo-space"

  - name: update_credential
    description: "更新指定凭证的配置。适用于已核对凭证 ID、需要变更字段时；可能影响已绑定该凭证的资源。"
