  - name: list_credential_types
    description: "列出可创建的凭证类型和配置字段。适用于尚不清楚凭证类型或表单结构时；该接口不创建凭证。"
    method: GET
    path: "/openapi/aidev/private/v1/credential_types/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev list_credential_types"

  - name: list_credentials
    description: "按空间和筛选条件查找凭证配置，结果可能分页。适用于定位待绑定或待维护的凭证；不要将列表结果当作密钥明文。"
    method: GET
    path: "/openapi/aidev/private/v1/credentials/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: credential_name
        in: query
        type: string
        description: "凭证名称模糊搜索"
      - name: credential_types
        in: query
        type: string
        description: "凭证类型过滤"
      - name: order_by
        in: query
        type: string
        description: "排序字段"
      - name: order_method
        in: query
        type: string
        description: "排序方式"
      - name: page
        in: query
        type: int
        description: "页码"
      - name: page_size
        in: query
        type: int
        description: "每页条数"
      - name: space_id
        in: query
        type: string
        description: "空间 ID；省略或 all 表示所有有权限的空间"
    examples:
      - "bk-cli aidev list_credentials"

  - name: create_credential
    description: "在指定空间创建凭证配置，返回凭证 ID。仅在明确需要新凭证且字段已确认时调用；凭证生命周期与绑定关系分开管理。"
    method: POST
    path: "/openapi/aidev/private/v1/credentials/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "CredentialCreateRequest",
        "required": [
          "credential_name",
          "credential_type",
          "credential_detail",
          "space_id"
        ],
        "properties": {
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "description": {
            "type": "string",
            "title": "Description",
            "default": "",
            "maxLength": 1024,
            "description": "凭证描述"
          },
          "credential_code": {
            "type": "string",
            "title": "Credential Code",
            "default": "",
            "maxLength": 64,
            "description": "凭证英文标识"
          },
          "credential_name": {
            "type": "string",
            "title": "Credential Name",
            "description": "凭证名称"
          },
          "credential_type": {
            "enum": [
              "apigw",
              "apigw_access_token",
              "basic_auth",
              "github_token",
              "gongfeng_token",
              "gitlab_token",
              "custom"
            ],
            "type": "string",
            "title": "CredentialType",
            "description": "凭证类型"
          },
          "credential_detail": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": true
              },
              {
                "type": "array",
                "items": {}
              }
            ],
            "title": "Credential Detail",
            "description": "凭证配置详情"
          }
        },
        "description": "B 端创建凭证请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev create_credential --body '{\"credential_name\":\"demo-credential\",\"credential_type\":\"api_key\",\"credential_detail\":\"demo-credential-detail\",\"space_id\":\"demo-space\"}'"

  - name: batch_delete_credentials
    description: "批量删除指定凭证；先逐项确认 ID 与引用关系。适用于一次清理多个已确认不再使用的凭证。"
