    path: "/openapi/aidev/private/v1/agents/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "AgentCreateRequest",
        "required": [
          "space_id",
          "agent_name",
          "agent_code"
        ],
        "properties": {
          "icon": {
            "type": "string",
            "title": "Icon",
            "default": "",
            "description": "智能体图标"
          },
          "app_code": {
            "type": "string",
            "title": "App Code",
            "nullable": true,
            "description": "绑定的蓝鲸应用 app_code"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "is_public": {
            "type": "boolean",
            "title": "Is Public",
            "default": false,
            "description": "是否公开"
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "title": "Tag Names",
            "description": "标签名称列表"
          },
          "agent_code": {
            "type": "string",
            "title": "Agent Code",
            "description": "智能体标识"
          },
          "agent_name": {
            "type": "string",
            "title": "Agent Name",
            "description": "智能体名称"
          },
          "agent_type": {
            "type": "string",
            "title": "Agent Type",
            "default": "single",
            "description": "智能体类型"
          },
          "user_scope": {
            "enum": [
              "public",
              "custom"
            ],
            "type": "string",
            "title": "User Scope",
            "nullable": true,
            "description": "创建时的人员使用范围；省略沿用平台默认值，public 对所有人开放"
          },
          "description": {
            "type": "string",
            "title": "Description",
            "default": "",
            "description": "智能体描述"
          },
          "business_ids": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "title": "Business Ids",
            "nullable": true,
            "description": "业务标签 ID 列表"
          },
          "generate_type": {
            "type": "string",
            "title": "Generate Type",
            "default": "space",
            "description": "公开类型"
          },
          "is_bind_bk_saas": {
            "type": "boolean",
            "title": "Is Bind Bk Saas",
            "default": false,
            "description": "是否绑定已有蓝鲸应用"
          },
          "service_catalogue": {
            "type": "array",
            "items": {},
            "title": "Service Catalogue",
            "nullable": true,
            "description": "服务目录"
          },
          "expected_efficiency_minutes": {
            "type": "integer",
            "title": "Expected Efficiency Minutes",
            "default": 0,
            "minimum": 0,
            "description": "单次会话预计提效时长（分钟）"
          }
        },
        "description": "Agent 创建请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev create_agent --body '{\"space_id\":\"demo-space\",\"agent_name\":\"Demo Agent\",\"agent_code\":\"demo-agent\"}'"

  - name: get_agent
    description: "读取指定智能体的配置：不传 version 返回当前草稿配置；传 version 返回指定已发布版本。适用于同步前比对草稿、核对依赖或读取已发布子智能体配置。"
    method: GET
    path: "/openapi/aidev/private/v1/agents/{agent_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_id
        in: path
        type: int
        description: "Agent ID"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
      - name: version
        in: query
        type: string
        description: "已发布版本号；不传返回当前草稿配置"
    examples:
      - "bk-cli aidev get_agent --agent_id 1 --space_id demo-space"

  - name: archive_agent
    description: "归档指定智能体；已发布的插件应用可能异步下架。适用于明确要移除智能体时，先核对目标 ID 和资源引用。"
    method: DELETE
    path: "/openapi/aidev/private/v1/agents/{agent_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_id
        in: path
        type: int
        description: "Agent ID"
        required: true
    examples:
      - "bk-cli aidev archive_agent --agent_id 1"

  - name: publish_agent
    description: "提交指定智能体的发布请求并返回版本与状态。建议不传 version，由平台自动生成：首次为 1.0.0，后续递增末位；仅在确需指定版本号时传入。pending 或 running 表示后台处理中，不等于发布或部署完成。"
    method: POST
    path: "/openapi/aidev/private/v1/agents/{agent_id}/publish/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "AgentPublishRequest",
        "required": [
          "space_id",
          "agent_id"
        ],
        "properties": {
          "version": {
            "type": "string",
            "title": "Version",
            "nullable": true,
            "description": "发布版本号；不传时首次为 1.0.0，后续自动递增末位"
          },
          "agent_id": {
            "type": "integer",
            "title": "Agent Id",
            "description": "Agent ID"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "agent_url": {
            "type": "string",
            "title": "Agent Url",
            "default": "",
            "description": "智能体地址，发布到开发者中心时由系统自动填充"
          },
          "release_log": {
            "type": "string",
            "title": "Release Log",
            "default": "",
            "description": "版本发布说明"
          },
          "agent_api_url": {
            "type": "string",
            "title": "Agent Api Url",
            "default": "",
            "description": "智能体 API 地址，发布到开发者中心时由系统自动填充"
          },
          "publish_config_only": {
            "type": "boolean",
            "title": "Publish Config Only",
            "default": false,
            "description": "是否只发布配置，不发布到开发者中心"
          },
          "is_publish_to_paas_v3": {
            "type": "boolean",
            "title": "Is Publish To Paas V3",
            "default": false,
            "description": "是否发布到蓝鲸开发者中心"
          }
        },
        "description": "Agent 发布请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_id
        in: path
        type: int
        description: "Agent ID"
        required: true
    examples:
      - "bk-cli aidev publish_agent --agent_id 1 --body '{\"space_id\":\"demo-space\",\"agent_id\":1}'"

  - name: update_agent
    description: "更新已有智能体的配置，包括模型、Prompt、知识库、Skill 和 MCP 等引用。适用于完成依赖解析及差异核对后同步配置；会改变线上智能体。"
