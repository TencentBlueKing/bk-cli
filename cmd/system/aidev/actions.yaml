        "title": "CredentialBatchDeleteRequest",
        "required": [
          "space_id",
          "credential_ids"
        ],
        "properties": {
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "credential_ids": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "title": "Credential Ids",
            "minItems": 1,
            "description": "凭证 ID 列表"
          }
        },
        "description": "批量删除凭证请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev batch_delete_credentials --body '{\"space_id\":\"demo-space\",\"credential_ids\":[]}'"

  - name: bind_credential
    description: "将已有凭证绑定到目标资源。适用于凭证和资源均已确定时；会改变目标资源的凭证关联。"
    method: POST
    path: "/openapi/aidev/private/v1/credentials/bind/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "CredentialBindRequest",
        "required": [
          "space_id",
          "credential_id",
          "resource_type",
          "resource_id"
        ],
        "properties": {
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "resource_id": {
            "type": "integer",
            "title": "Resource Id",
            "description": "资源 ID"
          },
          "credential_id": {
            "type": "integer",
            "title": "Credential Id",
            "description": "凭证 ID"
          },
          "resource_type": {
            "enum": [
              "tool",
              "knowledge",
              "cr",
              "mcp",
              "agent"
            ],
            "type": "string",
            "title": "CredentialReferenceType",
            "description": "凭证引用类型"
          }
        },
        "description": "绑定凭证请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev bind_credential --body '{\"space_id\":\"demo-space\",\"credential_id\":1,\"resource_type\":\"skill\",\"resource_id\":1}'"

  - name: unbind_credential
    description: "解除凭证与目标资源的绑定。适用于明确撤销该关联时；可能影响目标资源调用外部服务。"
    method: POST
    path: "/openapi/aidev/private/v1/credentials/unbind/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "CredentialUnbindRequest",
        "required": [
          "space_id",
          "credential_id",
          "resource_type",
          "resource_id"
        ],
        "properties": {
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "resource_id": {
            "type": "integer",
            "title": "Resource Id",
            "description": "资源 ID"
          },
          "credential_id": {
            "type": "integer",
            "title": "Credential Id",
            "description": "凭证 ID"
          },
          "resource_type": {
            "enum": [
              "tool",
              "knowledge",
              "cr",
              "mcp",
              "agent"
            ],
            "type": "string",
            "title": "CredentialReferenceType",
            "description": "凭证引用类型"
          }
        },
        "description": "解绑凭证请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev unbind_credential --body '{\"space_id\":\"demo-space\",\"credential_id\":1,\"resource_type\":\"skill\",\"resource_id\":1}'"

  - name: delete_credential
    description: "删除指定凭证。先查询引用并确认解绑或影响范围，再执行删除。"
    method: DELETE
    path: "/openapi/aidev/private/v1/credentials/{credential_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
