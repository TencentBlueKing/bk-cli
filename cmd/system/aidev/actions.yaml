            "maxLength": 1024,
            "description": "图标 URL"
          },
          "content": {
            "type": "string",
            "title": "Content",
            "description": "Prompt 内容"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "is_public": {
            "type": "boolean",
            "title": "Is Public",
            "default": false,
            "description": "是否公开"
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "title": "Tag Names",
            "nullable": true,
            "description": "标签"
          },
          "variables": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            },
            "title": "Variables",
