name: aidev
gateway_name: bk-aidev
description: "BlueKing AIDev resource commands"
actions:
  - name: list_spaces
    description: "列出当前调用身份可访问的空间及 space_id，支持关键词过滤。适用于尚未确定目标空间时；该接口不授予空间权限。"
    method: GET
    path: "/openapi/aidev/private/v1/spaces/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: keyword
        in: query
        type: string
        description: "搜索关键词，支持空间名称模糊搜索"
    examples:
      - "bk-cli aidev list_spaces"

  - name: list_skills
    description: "按空间和 fuzzy 关键词筛选 Skill 并取得 ID；结果可能分页，调用方需逐项精确比对 skill_code。适用于同步前查重或 Agent Skill 引用解析。"
    method: GET
    path: "/openapi/aidev/private/v1/skills/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: fuzzy
        in: query
        type: string
        description: "模糊搜索关键词"
      - name: generate_type
        in: query
        type: string
        description: "公开类型"
      - name: group_type
        in: query
        type: string
        description: "分组类型"
      - name: order_by
        in: query
        type: string
        description: "排序字段"
      - name: order_method
        in: query
        type: string
        description: "排序方式"
      - name: page
        in: query
        type: int
        description: "页码"
      - name: page_size
        in: query
        type: int
        description: "每页条数"
      - name: space_id
        in: query
        type: string
        description: "空间 ID；省略或 all 表示所有有权限的空间"
      - name: tag_id
        in: query
        type: string
        description: "标签 ID"
      - name: tag_name
        in: query
        type: string
        description: "标签名称"
    examples:
      - "bk-cli aidev list_skills"

  - name: upsert_skill
    description: "使用已上传的 Skill 制品按 skill_code 创建或更新 Skill。已有编码会更新；同版本是否可覆盖受 allow_version_overwrite 控制。适用于完成 ZIP 上传和版本核对后。"
    method: POST
    path: "/openapi/aidev/private/v1/skills/upsert/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "SkillUpsertRequest",
        "required": [
          "space_id",
          "skill_code",
          "skill_name",
          "description",
          "url"
        ],
        "properties": {
          "url": {
            "type": "string",
            "title": "Url",
            "description": "Skill ZIP 的 bkrepo:// 地址或 skillfiles 存储路径"
          },
          "icon": {
            "type": "string",
            "title": "Icon",
            "default": "",
            "nullable": true,
            "description": "图标"
          },
          "version": {
            "type": "string",
            "title": "Version",
            "nullable": true,
            "description": "版本号，不传则自动递增"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "file_name": {
            "type": "string",
            "title": "File Name",
            "nullable": true,
            "description": "原始文件名，不传则从 url 路径中解析"
          },
          "is_public": {
            "type": "boolean",
            "title": "Is Public",
            "default": false,
            "nullable": true,
            "description": "是否公开"
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "title": "Tag Names",
            "nullable": true,
            "description": "标签"
          },
          "skill_code": {
            "type": "string",
            "title": "Skill Code",
            "description": "Skill 唯一标识"
          },
          "skill_name": {
            "type": "string",
            "title": "Skill Name",
            "description": "Skill 名称"
          },
          "description": {
            "type": "string",
            "title": "Description",
            "description": "Skill 描述"
          },
          "generate_type": {
            "type": "string",
            "title": "Generate Type",
            "default": "space",
            "nullable": true,
            "description": "公开类型"
          },
          "allow_version_overwrite": {
            "type": "boolean",
            "title": "Allow Version Overwrite",
            "default": true,
            "description": "是否允许覆盖已存在的同版本"
          }
        },
        "description": "Skill 创建/更新请求（私有/应用侧共用，space_id 必填）"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev upsert_skill --body '{\"space_id\":\"demo-space\",\"skill_code\":\"demo-skill\",\"skill_name\":\"Demo Skill\",\"description\":\"demo description\",\"url\":\"bkrepo://demo.zip\"}'"

  - name: get_skill
    description: "读取指定 Skill 的配置；传 version 时读取该版本。适用于同步前比对、确认版本或解析 Agent 引用。"
    method: GET
    path: "/openapi/aidev/private/v1/skills/{skill_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: skill_id
        in: path
        type: int
        description: "Skill ID"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
      - name: version
        in: query
        type: string
        description: "版本号，不传则返回最新版本"
    examples:
      - "bk-cli aidev get_skill --skill_id 1 --space_id demo-space"

  - name: archive_skill
    description: "归档指定 Skill。先核对目标 ID、版本和 Agent 引用，再执行。"
    method: DELETE
    path: "/openapi/aidev/private/v1/skills/{skill_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: skill_id
        in: path
        type: int
        description: "Skill ID"
        required: true
    examples:
      - "bk-cli aidev archive_skill --skill_id 1"

  - name: get_skill_download_url
    description: "获取指定 Skill 文件的临时下载链接。适用于核对或下载已有制品；链接有时效，不用于上传新版本。"
    method: GET
    path: "/openapi/aidev/private/v1/skills/{skill_id}/download/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: skill_id
        in: path
        type: int
        description: "Skill ID"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev get_skill_download_url --skill_id 1 --space_id demo-space"

  - name: list_skill_versions
    description: "列出指定 Skill 的历史版本。适用于选择待查看或下载的版本；不改变当前版本。"
    method: GET
    path: "/openapi/aidev/private/v1/skills/{skill_id}/versions/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: skill_id
        in: path
        type: int
        description: "Skill ID"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev list_skill_versions --skill_id 1 --space_id demo-space"

  - name: list_mcps
    description: "按空间、mcp_code 和类型列出 MCP 候选，结果可能分页。适用于发现资源；建立 Agent 引用时应改用 by-code 精确确认。"
    method: GET
    path: "/openapi/aidev/private/v1/mcps/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_code
        in: query
        type: string
        description: "查询该编码已获授权的 APIGW MCP；智能体已创建时校验空间归属，未创建时仍校验请求空间权限"
      - name: created_by
        in: query
        type: string
        description: "创建人"
      - name: description
        in: query
        type: string
        description: "描述"
      - name: fuzzy
        in: query
        type: string
        description: "模糊搜索关键词"
      - name: mcp_code
        in: query
        type: string
        description: "MCP 英文标识"
      - name: mcp_name
        in: query
        type: string
        description: "MCP 名称"
      - name: mcp_type
        in: query
        type: string
        description: "按 MCP 类型过滤：apigw / resource；未传则同时返回 resource 与 APIGW MCP"
      - name: order_by
        in: query
        type: string
        description: "排序字段"
      - name: order_method
        in: query
        type: string
        description: "排序方式"
      - name: page
        in: query
        type: int
        description: "页码"
      - name: page_size
        in: query
        type: int
        description: "每页条数"
      - name: space_id
        in: query
        type: string
        description: "空间 ID；省略或 all 表示所有有权限的空间"
      - name: tag_id
        in: query
        type: string
        description: "标签 ID"
      - name: tag_name
        in: query
        type: string
        description: "标签名称"
      - name: tag_names
        in: query
        type: string
        description: "标签完整路径"
      - name: updated_by
        in: query
        type: string
        description: "更新人"
    examples:
      - "bk-cli aidev list_mcps"

  - name: create_mcp
    description: "在指定空间创建 MCP 配置。适用于确需新建 MCP 时；Agent 引用已有 MCP 应先使用 by-code 精确查询。"
    method: POST
    path: "/openapi/aidev/private/v1/mcps/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "MCPCreateRequest",
        "required": [
          "space_id",
          "mcp_name",
          "mcp_code",
          "url",
          "protocol",
          "credential_type",
          "description"
        ],
        "properties": {
          "url": {
            "type": "string",
            "title": "Url",
            "description": "MCP 服务地址"
          },
          "icon": {
            "type": "string",
            "title": "Icon",
            "nullable": true,
            "description": "MCP 图标"
          },
          "mcp_code": {
            "type": "string",
            "title": "Mcp Code",
            "pattern": "^[a-z][a-z0-9_-]{0,63}$",
            "maxLength": 64,
            "description": "MCP 英文标识"
          },
          "mcp_name": {
            "type": "string",
            "title": "Mcp Name",
            "description": "MCP 名称"
          },
          "protocol": {
            "allOf": [
              {
                "enum": [
                  "stdio",
                  "streamable_http",
                  "sse"
                ],
                "type": "string"
              }
            ],
            "title": "Protocol",
            "description": "通信协议"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "is_public": {
            "type": "boolean",
            "title": "Is Public",
            "default": false,
            "description": "是否公开"
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "title": "Tag Names",
            "description": "标签完整路径列表"
          },
          "user_guide": {
            "type": "string",
            "title": "User Guide",
            "default": "",
            "maxLength": 1024,
            "description": "使用文档"
          },
          "description": {
            "type": "string",
            "title": "Description",
            "description": "MCP 描述"
          },
          "credential_id": {
            "type": "integer",
            "title": "Credential Id",
            "nullable": true,
            "description": "自定义凭证 ID"
          },
          "generate_type": {
            "allOf": [
              {
                "enum": [
                  "space",
                  "user",
                  "public",
                  "global"
                ],
                "type": "string"
              }
            ],
            "title": "Generate Type",
            "default": "space",
            "description": "公开类型"
          },
          "credential_type": {
            "allOf": [
              {
                "enum": [
                  "null",
                  "blueapps",
                  "custom"
                ],
                "type": "string"
              }
            ],
            "title": "Credential Type",
            "description": "凭证类型"
          }
        },
        "description": "MCP 创建请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev create_mcp --body '{\"space_id\":\"demo-space\",\"mcp_name\":\"Demo MCP\",\"mcp_code\":\"demo-mcp\",\"url\":\"bkrepo://demo.zip\",\"protocol\":\"stdio\",\"credential_type\":\"api_key\",\"description\":\"demo description\"}'"

  - name: get_mcp
    description: "按类型和 ID 读取 MCP 详情。适用于已取得准确 ID 后核对资源型或 APIGW MCP 配置。"
    method: GET
    path: "/openapi/aidev/private/v1/mcps/{mcp_type}/{mcp_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_code
        in: query
        type: string
        description: "按编码查询 APIGW 授权；智能体已创建时校验空间归属"
      - name: mcp_id
        in: path
        type: int
        description: "MCP ID"
        required: true
      - name: mcp_type
        in: path
        type: string
        description: "MCP 类型，resource 表示资源型 MCP，apigw 表示 APIGW MCP"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev get_mcp --mcp_id 1 --mcp_type apigw --space_id demo-space"

  - name: get_mcp_register_json
    description: "获取指定类型和 ID 的 MCP 注册 JSON，供外部客户端注册工具；不创建 MCP，也不授权 Agent。"
    method: GET
    path: "/openapi/aidev/private/v1/mcps/{mcp_type}/{mcp_id}/register_json/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_code
        in: query
        type: string
        description: "按编码查询 APIGW 授权；智能体已创建时校验空间归属"
      - name: mcp_id
        in: path
        type: int
        description: "MCP ID"
        required: true
      - name: mcp_type
        in: path
        type: string
        description: "MCP 类型，resource 表示资源型 MCP，apigw 表示 APIGW MCP"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev get_mcp_register_json --mcp_id 1 --mcp_type apigw --space_id demo-space"

  - name: query_knowledgebase
    description: "在指定空间对知识库内容发起检索并返回命中结果。适用于回答知识问题；不用于查找知识库配置或同步文档。"
    method: POST
    path: "/openapi/aidev/private/v1/knowledgebase/query/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "ScopedKnowledgeBaseQueryRequest",
        "required": [
          "space_id",
          "query"
        ],
        "properties": {
          "raw": {
            "type": "boolean",
            "title": "是否返回未精排结果",
            "default": false,
            "nullable": true
          },
          "tags": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "title": "标签"
          },
          "topk": {
            "type": "integer",
            "title": "前多少个",
            "default": 5,
            "minimum": 1,
            "nullable": true
          },
          "type": {
            "allOf": [
              {
                "enum": [
                  "nature",
                  "index_specific"
                ],
                "type": "string",
                "title": "KnowledgeBaseQueryType",
                "description": "检索类型"
              }
            ],
            "title": "检索类型",
            "default": "nature",
            "nullable": true
          },
          "debug": {
            "type": "boolean",
            "title": "是否调试",
            "default": false,
            "nullable": true
          },
          "model": {
            "type": "string",
            "title": "检索使用的大模型",
            "nullable": true
          },
          "query": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "array",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "object",
                      "additionalProperties": true
                    }
                  ]
                }
              }
            ],
            "title": "匹配内容（文本或图文content）"
          },
          "thres": {
            "type": "number",
            "title": "最低相关度",
            "default": 0,
            "nullable": true
          },
          "filter": {
            "allOf": [
              {
                "type": "object",
                "title": "Filter",
                "properties": {
                  "scalar": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "title": "ScalarFilter",
                      "required": [
                        "expression"
                      ],
                      "properties": {
                        "expression": {
                          "type": "string",
                          "title": "表达式"
                        }
                      }
                    },
                    "title": "标量过滤",
                    "nullable": true
                  },
                  "vector": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "title": "VectorFilter",
                      "required": [
                        "index_name",
                        "index_value"
                      ],
                      "properties": {
                        "topk": {
                          "type": "integer",
                          "title": "前多少个",
                          "minimum": 1,
                          "nullable": true
                        },
                        "scalar": {
                          "allOf": [
                            {
                              "type": "object",
                              "title": "ScalarFilter",
                              "required": [
                                "expression"
                              ],
                              "properties": {
                                "expression": {
                                  "type": "string",
                                  "title": "表达式"
                                }
                              }
                            }
                          ],
                          "title": "标量过滤",
                          "nullable": true
                        },
                        "index_name": {
                          "type": "string",
                          "title": "索引名称"
                        },
                        "index_type": {
                          "type": "string",
                          "title": "索引类型",
                          "default": "vector-full_text",
                          "nullable": true
                        },
                        "index_value": {
                          "type": "string",
                          "title": "索引值"
                        },
                        "knowledge_id": {
                          "type": "integer",
                          "title": "知识ID",
                          "nullable": true
                        },
                        "knowledge_base_id": {
                          "type": "integer",
                          "title": "知识库ID",
                          "nullable": true
                        }
                      }
                    },
                    "title": "向量过滤",
                    "nullable": true
                  }
                }
              }
            ],
            "title": "通用搜索条件",
            "default": {},
            "nullable": true
          },
          "origin": {
            "type": "boolean",
            "title": "是否返回检索原始文档内容",
            "default": false,
            "nullable": true
          },
          "polish": {
            "type": "boolean",
            "title": "是否需要润色",
            "default": false,
            "nullable": true
          },
          "stream": {
            "type": "boolean",
            "title": "是否需要流式返回",
            "default": false,
            "nullable": true
          },
          "llm_code": {
            "type": "string",
            "title": "LLM",
            "default": "",
            "nullable": true
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "with_rrf": {
            "type": "boolean",
            "title": "是否融合不同查询变体的排名",
            "default": true
          },
          "use_rerank": {
            "type": "boolean",
            "title": "是否使用rerank模型",
            "default": true
          },
          "rrf_weights": {
            "type": "object",
            "title": "RRF融合权重",
            "additionalProperties": {
              "type": "number"
            }
          },
          "anchor_paths": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "title": "游标路径",
            "default": [],
            "nullable": true
          },
          "chat_history": {
            "type": "array",
            "items": {
              "type": "object",
              "title": "KnowledgeQueryChatMessage",
              "required": [
                "role",
                "content"
              ],
              "properties": {
                "role": {
                  "allOf": [
                    {
                      "enum": [
                        "user",
                        "assistant"
                      ],
                      "type": "string"
                    }
                  ],
                  "title": "Role"
                },
                "content": {
                  "type": "string",
                  "title": "Content",
                  "minLength": 1
                }
              },
              "description": "知识查询使用的会话历史消息。"
            },
            "title": "会话历史，仅用于自然语言非 raw 查询的查询预处理"
          },
          "knowledge_id": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "title": "知识ID",
            "nullable": true
          },
          "query_function": {
            "allOf": [
              {
                "enum": [
                  "semantic",
                  "mixed",
                  "sql"
                ],
                "type": "string",
                "title": "KnowledgeBaseQueryFunction",
                "description": "检索方式"
              }
