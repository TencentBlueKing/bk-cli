            "allOf": [
              {
                "type": "object",
                "title": "_ModelSetting",
                "properties": {
                  "llm_code": {
                    "type": "string",
                    "title": "Llm Code",
                    "nullable": true,
                    "description": "LLM 编码"
                  },
                  "max_tokens": {
                    "type": "integer",
                    "title": "Max Tokens",
                    "nullable": true,
                    "description": "最大 token 数"
                  },
                  "temperature": {
                    "type": "number",
                    "title": "Temperature",
                    "nullable": true,
                    "description": "温度"
                  },
                  "context_window": {
                    "type": "integer",
                    "title": "Context Window",
                    "nullable": true,
                    "description": "上下文窗口"
                  },
                  "fallback_model": {
                    "type": "string",
                    "title": "Fallback Model",
                    "nullable": true,
                    "description": "备用 LLM 编码"
                  },
                  "llm_token_limit": {
                    "type": "integer",
                    "title": "Llm Token Limit",
                    "nullable": true,
                    "description": "LLM token 限制"
                  },
                  "tool_output_compress_thrd": {
                    "type": "integer",
                    "title": "Tool Output Compress Thrd",
                    "nullable": true,
                    "description": "工具输出压缩阈值"
                  }
                },
                "description": "模型配置"
              }
            ],
            "nullable": true,
            "description": "模型配置"
          },
          "prompt": {
            "allOf": [
              {
                "type": "object",
                "title": "_PromptSetting",
                "properties": {
                  "prompt_type": {
                    "type": "string",
                    "title": "Prompt Type",
                    "nullable": true,
