  - name: reclean_knowledge
    description: "按当前或指定导入链路重新清洗并重建知识产物。适用于确认现有产物需重建时；会触发后台处理。"
    method: POST
    path: "/openapi/aidev/private/v1/knowledges/reclean/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "KnowledgeRecleanRequest",
        "required": [
          "space_id"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "title": "知识ID",
            "nullable": true
          },
          "ids": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "title": "知识ID列表",
            "nullable": true
          },
          "force": {
            "type": "boolean",
            "title": "是否跳过版本差异判定强制重建",
            "default": false
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "pipeline_code": {
            "type": "string",
            "title": "指定重新清洗的导入链路",
            "default": "",
            "nullable": true
          },
          "include_failed": {
            "type": "boolean",
            "title": "是否包含历史失败知识",
            "default": false
          }
        },
        "description": "重新清洗请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev reclean_knowledge --body '{\"space_id\":\"demo-space\"}'"

  - name: list_resource_references
    description: "查询哪些 Agent 引用了指定类型和 ID 的资源。适用于删除或变更 Skill、MCP、知识库等资源前评估影响。"
    method: GET
    path: "/openapi/aidev/private/v1/resources/{resource_type}/{instance_id}/references/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: instance_id
        in: path
        type: int
        description: "资源实例 ID"
        required: true
      - name: resource_type
        in: path
        type: string
        description: "资源类型：agent、collection、knowledgebase、llm、mcp、skill、tool"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev list_resource_references --instance_id 1 --resource_type skill --space_id demo-space"

  - name: list_collections
    description: "按空间和 collection_code 查找角色 Prompt Collection，取得 collection_id；结果可能分页。适用于 Agent 引用解析或同步前查重。"
    method: GET
    path: "/openapi/aidev/private/v1/collections/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: collection_code
        in: query
        type: string
        description: "按编码精确查询"
      - name: collection_name
        in: query
        type: string
        description: "按名称模糊查询"
      - name: page
        in: query
        type: int
      - name: page_size
        in: query
        type: int
      - name: space_id
        in: query
        type: string
        description: "空间 ID；省略或 all 表示所有有权限的空间"
    examples:
      - "bk-cli aidev list_collections"

  - name: upsert_collection
    description: "按 collection_code 创建或更新角色 Prompt Collection，并返回 collection_id。适用于同步 Agent 所引用的角色指令；已有编码会更新线上内容。"
    method: POST
    path: "/openapi/aidev/private/v1/collections/upsert/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "CollectionUpsertRequest",
        "required": [
          "space_id",
          "collection_code",
          "collection_name",
          "content"
        ],
        "properties": {
          "icon": {
            "type": "string",
            "title": "Icon",
            "nullable": true,
            "maxLength": 1024
          },
          "content": {
            "type": "array",
            "items": {
              "type": "object",
              "title": "CollectionMessage",
              "required": [
                "role",
                "content"
              ],
              "properties": {
                "role": {
                  "allOf": [
                    {
                      "enum": [
                        "system",
                        "user",
                        "assistant"
                      ],
                      "type": "string"
                    }
                  ],
                  "title": "Role"
                },
                "content": {
                  "type": "string",
                  "title": "Content",
                  "minLength": 1
                }
              },
              "additionalProperties": false
            },
            "title": "Content",
            "minItems": 1
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "is_public": {
            "type": "boolean",
            "title": "Is Public",
            "default": false
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "title": "Tag Names"
          },
          "generate_type": {
            "allOf": [
              {
                "enum": [
                  "space",
                  "public",
                  "global"
                ],
                "type": "string"
              }
            ],
            "title": "Generate Type",
            "default": "space"
          },
          "collection_code": {
            "type": "string",
            "title": "Collection Code",
            "maxLength": 255,
            "minLength": 1
          },
          "collection_name": {
            "type": "string",
            "title": "Collection Name",
            "maxLength": 255,
            "minLength": 1
          }
        },
        "description": "固定消息角色；不接收模板变量和默认模型配置。",
        "additionalProperties": false
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev upsert_collection --body '{\"space_id\":\"demo-space\",\"collection_code\":\"demo-collection\",\"collection_name\":\"Demo Collection\",\"content\":[]}'"

  - name: get_collection
    description: "读取指定角色 Prompt Collection 的消息内容及配置。适用于同步前比对，或确认 Agent 引用的现有 Collection。"
    method: GET
    path: "/openapi/aidev/private/v1/collections/{collection_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: collection_id
        in: path
        type: int
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev get_collection --collection_id 1 --space_id demo-space"

  - name: import_knowledge_archive
    description: "将已上传或远程 ZIP 异步导入指定 anchor_path，并覆盖目标目录内容。适用于目录化文档同步；返回任务 ID 后用相同 anchor_path 查询 status_info，不应把提交成功当作处理完成。"
    method: POST
    path: "/openapi/aidev/private/v1/knowledges/archive/import/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "KnowledgeArchiveImportRequest",
        "required": [
          "space_id",
          "url",
          "file_name",
          "file_type",
          "anchor_path"
        ],
        "properties": {
          "url": {
            "type": "string",
            "title": "上传结果URL或远程ZIP链接"
          },
          "config": {
            "type": "object",
            "title": "知识配置",
            "additionalProperties": true
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "file_name": {
            "type": "string",
            "title": "来源名称",
            "description": "ZIP 不含 .zip 扩展名；文件夹使用目录名称"
          },
          "file_size": {
            "type": "integer",
            "title": "上传文件字节数",
            "default": 0
          },
          "file_type": {
            "type": "string",
            "title": "文件类型",
            "description": "zip 或 folder；folder 表示已上传的本地文件夹"
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "title": "标签路径列表"
          },
          "anchor_path": {
            "type": "string",
            "title": "导入目标目录",
            "description": "目标知识库及目录，导入将覆盖目录内容"
          },
          "created_type": {
            "type": "string",
            "title": "来源类型",
            "default": "file",
            "description": "file 或 link"
          },
          "index_config": {
            "type": "object",
            "title": "索引配置",
            "additionalProperties": true
          },
          "credential_id": {
            "type": "integer",
            "title": "凭证ID",
            "nullable": true
          }
        },
        "description": "ZIP 导入请求；复用管理端校验和目标目录语义。"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev import_knowledge_archive --body '{\"space_id\":\"demo-space\",\"url\":\"bkrepo://demo.zip\",\"file_name\":\"demo\",\"file_type\":\"zip\",\"anchor_path\":\"/\"}'"

  - name: get_mcp_by_code
    description: "按 mcp_type 和 mcp_code 精确解析 MCP 的 ID、类型及可用范围。适用于 Agent 配置引用 MCP 时；传 agent_code 可按目标 Agent 的关联场景检查 APIGW MCP。"
    method: GET
    path: "/openapi/aidev/private/v1/mcps/by-code/{mcp_code}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_code
        in: query
        type: string
        description: "智能体编码；允许尚未创建，已创建时仍校验空间归属和调用方授权"
      - name: mcp_code
        in: path
        type: string
        description: "MCP 编码，精确匹配且必须唯一"
        required: true
      - name: mcp_type
        in: query
        type: string
        description: "MCP 类型，默认 apigw"
      - name: space_id
        in: query
        type: string
        description: "空间 ID；省略或 all 表示所有有权限的空间"
    examples:
      - "bk-cli aidev get_mcp_by_code --mcp_code demo-mcp"

  - name: get_resource_mcp
    description: "读取指定资源型 MCP 的详情。适用于已知资源型 MCP ID 时核对配置。"
    method: GET
    path: "/openapi/aidev/private/v1/mcps/{mcp_id}/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: mcp_id
        in: path
        type: int
        description: "MCP ID"
        required: true
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev get_resource_mcp --mcp_id 1 --space_id demo-space"

  - name: apply_cross_space_resources
    description: "为指定资源发起跨空间使用申请，返回请求 ID 和审批工单信息。适用于目标空间尚无资源使用权限时；提交申请不等于授权已生效。"
    method: POST
    path: "/openapi/aidev/private/v1/space_manage/apply_resources/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "SpaceResourceApplyRequest",
        "required": [
          "space_id",
          "resource_type",
          "resource_ids"
        ],
        "properties": {
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "request_id": {
            "type": "string",
            "title": "申请请求ID",
            "nullable": true
          },
          "callback_url": {
            "type": "string",
            "title": "回调URL",
            "nullable": true
          },
          "resource_ids": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "title": "资源ID列表"
          },
          "resource_type": {
            "allOf": [
              {
                "enum": [
                  "tool",
                  "agent",
                  "knowledgebase",
                  "knowledge",
                  "mcp",
                  "collection",
                  "prompt",
                  "llm",
                  "skill"
                ],
                "type": "string",
                "title": "ApplyResourceType",
                "description": "资源类型枚举"
              }
            ],
            "title": "资源类型"
          }
        },
        "description": "跨空间资源申请请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev apply_cross_space_resources --body '{\"space_id\":\"demo-space\",\"resource_type\":\"skill\",\"resource_ids\":[]}'"

  - name: check_upload_status
    description: "查询并校验直传文件是否存在、大小范围和 SHA256 格式，返回实际文件大小与摘要。调用方仍需与本地文件比对；适用于上传后或超时后确认结果，不会重新上传。"
    method: POST
    path: "/openapi/aidev/private/v1/upload/status/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "UploadStatusRequest",
        "required": [
          "space_id",
          "url"
        ],
        "properties": {
          "url": {
            "type": "string",
            "title": "Url"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev check_upload_status --body '{\"space_id\":\"demo-space\",\"url\":\"bkrepo://demo.zip\"}'"

  - name: get_upload_url
    description: "为 Skill 或知识 ZIP 申请限时、一次性的直传地址。适用于大文件直传；取得地址后仍需上传文件并校验状态。"
    method: POST
    path: "/openapi/aidev/private/v1/upload/url/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "UploadURLRequest",
        "required": [
          "space_id",
          "file_name"
        ],
        "properties": {
          "module": {
            "allOf": [
              {
                "enum": [
                  "knowledge",
                  "skill"
                ],
                "type": "string"
              }
            ],
            "title": "Module",
            "default": "knowledge"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "file_name": {
            "type": "string",
            "title": "File Name",
            "maxLength": 255,
            "minLength": 1
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev get_upload_url --body '{\"space_id\":\"demo-space\",\"file_name\":\"demo.md\"}'"

  - name: append_agent_admins
    description: "向智能体对应的开发者中心插件追加管理员，保留原有成员；不修改 Agent 使用者或空间权限。适用于 Agent 创建后补充管理员。"
    method: POST
    path: "/openapi/aidev/private/v1/agents/{agent_id}/admins/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "AgentAdminsRequest",
        "required": [
          "space_id",
          "agent_id"
        ],
        "properties": {
          "admins": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "title": "Admins",
            "nullable": true,
            "description": "追加的 bk_username 清单；省略、null、[] 不处理"
          },
          "agent_id": {
            "type": "integer",
            "title": "Agent Id",
            "description": "智能体 ID"
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          }
        }
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: agent_id
        in: path
        type: int
        description: "智能体 ID"
        required: true
    examples:
      - "bk-cli aidev append_agent_admins --agent_id 1 --body '{\"space_id\":\"demo-space\",\"agent_id\":1}'"

  - name: list_tags
    description: "获取当前租户指定范围的全量标签树，供智能体配置时选择标签；无需指定空间或智能体。"
    method: GET
    path: "/openapi/aidev/private/v1/tags/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: scope_name
        in: query
        type: string
        description: "标签范围，默认使用智能体标签范围；未识别的范围沿用 meta 回退到通用默认范围"
    examples:
      - "bk-cli aidev list_tags --scope_name agent"
