  - name: create_knowledgebase
    description: "在指定空间创建知识库配置并返回 ID。适用于 knowledgebase_code 不存在时；文档内容需另行上传和导入。"
    method: POST
    path: "/openapi/aidev/private/v1/knowledgebase/"
    body_required: true
    body_schema: |-
      {
        "type": "object",
        "title": "KnowledgeBaseCreateRequest",
        "required": [
          "space_id",
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "title": "知识库名称"
          },
          "config": {
            "type": "object",
            "title": "知识库配置",
            "nullable": true,
            "additionalProperties": true
          },
          "space_id": {
            "type": "string",
            "title": "Space Id",
            "minLength": 1,
            "description": "空间 ID，必填"
          },
          "is_public": {
            "type": "boolean",
            "title": "是否公开",
            "default": false,
            "nullable": true
          },
          "tag_names": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "title": "标签名称列表",
            "nullable": true
          },
          "description": {
            "type": "string",
            "title": "描述",
            "default": "",
            "nullable": true
          },
          "generate_type": {
            "type": "string",
            "title": "公开类型",
            "default": "space",
            "nullable": true
          },
          "knowledgebase_code": {
            "type": "string",
            "title": "知识库代码",
            "nullable": true
          }
        },
        "description": "创建知识库请求"
      }
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev create_knowledgebase --body '{\"space_id\":\"demo-space\",\"name\":\"demo\"}'"

  - name: get_knowledge_stats
    description: "读取指定空间内当前调用身份可访问的知识库与知识文档统计汇总。适用于了解数量和文件大小；不按单个知识库 ID 查询，也不返回完整配置。"
    method: GET
    path: "/openapi/aidev/private/v1/knowledgebase/info/"
    authConfig:
      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    params:
      - name: space_id
        in: query
        type: string
        description: "空间 ID，必填"
        required: true
    examples:
      - "bk-cli aidev get_knowledge_stats --space_id demo-space"

  - name: list_knowledgebases
    description: "按空间和 knowledgebase_code 筛选知识库并取得 ID；编码筛选为模糊匹配，调用方需逐项精确比对。这是只读查询，虽然使用 POST，结果可能分页。适用于同步前查重或 Agent 引用解析。"
