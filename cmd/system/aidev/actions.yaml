      appVerifiedRequired: true
      userVerifiedRequired: true
      resourcePermissionRequired: true
    examples:
      - "bk-cli aidev query_knowledgebase --body '{\"space_id\":\"demo-space\",\"query\":\"hello\"}'"

  - name: list_prompts
