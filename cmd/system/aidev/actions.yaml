      - name: credential_id
        in: path
        type: int
        description: "凭证 ID"
        required: true
    examples:
      - "bk-cli aidev delete_credential --credential_id 1"

  - name: list_credential_references
    description: "查询指定凭证被哪些资源引用。适用于更新、解绑或删除前评估影响。"
    method: GET
