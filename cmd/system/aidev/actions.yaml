        type: string
        description: "模糊搜索关键词"
      - name: generate_type
        in: query
        type: string
        description: "公开类型"
      - name: group_type
        in: query
        type: string
        description: "分组类型"
      - name: order_by
        in: query
        type: string
        description: "排序字段"
      - name: order_method
        in: query
        type: string
        description: "排序方式"
      - name: page
        in: query
