            ],
            "type": "string",
            "title": "CredentialType",
            "description": "凭证类型"
          },
          "credential_detail": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": true
              },
              {
                "type": "array",
                "items": {}
              }
            ],
            "title": "Credential Detail",
            "description": "凭证配置详情"
          }
        },
        "description": "B 端更新凭证请求"
      }
    authConfig:
      appVerifiedRequired: true
